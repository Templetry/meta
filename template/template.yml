schema_version: 1
name: meta-template
description: A template that creates Templetry templates — skeleton, author guide, mechanism showcase and verify CI
frameworks: [templetry]

variables:
  - key: template_name
    label: New template name
    type: string
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  - key: template_description
    label: Short description
    type: string
    default: "A new Templetry template"

  - key: kind_tags
    label: Kinds (comma-separated; frontend, backend, database, infra, multiplatform, android, ios, desktop, cli)
    type: string
    default: "backend"
  - key: language_tags
    label: Languages (comma-separated, kebab-case)
    type: string
    default: "typescript"
  - key: framework_tags
    label: Frameworks (comma-separated, kebab-case)
    type: string
    default: "custom"
identity:
  - from: "template.starter.yml"   # becomes the new template's manifest
    to: "template.yml"
  - from: "hello.py.tpl"           # carries output directives; renamed on render
    to: "hello.py"
  - from: "new-template-name"
    to: "{template_name}"
  - from: "NEW_TEMPLATE_DESCRIPTION"
    to: "{template_description}"

  - from: "KIND_TAGS"
    to: "{kind_tags}"
  - from: "LANGUAGE_TAGS"
    to: "{language_tags}"
  - from: "FRAMEWORK_TAGS"
    to: "{framework_tags}"

features:
  - key: ci
    label: Verify workflow (GitHub Actions)
    default: true
    files: [".github/workflows/verify.yml"]
