name: Verify forms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so upstream drift surfaces here and not in a user project.
    - cron: "0 6 * * 1"

jobs:
  meta-chain:
    name: template (meta chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/setup-templetry@main
      - name: Render the meta-template
        run: |
          templetry render --template ./template --out "$RUNNER_TEMP/tpl" \
            --set "template_name=verify-template" --set "template_description=CI verification run"
      - name: Render the generated template
        run: |
          templetry render --template "$RUNNER_TEMP/tpl" --out "$RUNNER_TEMP/out" \
            --set "project_name=Verify App" --feature extras
      - name: No leftovers across the chain
        run: |
          if grep -ri "sample-project\|SampleProject\|new-template-name\|NEW_TEMPLATE" "$RUNNER_TEMP/out"; then
            echo "identity leftovers in the meta chain"; exit 1
          fi
